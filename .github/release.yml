# Categories for GitHub's generated release notes (the PR-grouped section the
# release-notes script embeds).
#
# These use GitHub's stock labels wherever one fits -- `enhancement`, `bug`,
# `documentation` -- so a contributor arriving from any other repository already
# knows the vocabulary. Only `breaking` and `capture` are custom, because
# nothing stock means either thing.
#
# The labels therefore do NOT match this project's commit prefixes: a commit
# says `feat:` / `fix:` / `docs:` while its pull request is labelled
# `enhancement` / `bug` / `documentation`. That divergence is deliberate --
# commit prefixes are for maintainers reading `git log`, labels are for
# contributors and for this file -- so please do not "fix" it into agreement.
#
# The catch-all means forgetting a label costs nothing. `release` marks the
# automated version-bump PR.
changelog:
  exclude:
    labels:
      - release
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Harness evidence
      labels: [capture]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
