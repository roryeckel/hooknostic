name: Release draft

# Stage 2 of the release pipeline (docs/releases.md): when the release PR
# merges, generate release notes and create a DRAFT release. A draft
# materializes no tag -- deleting a bad one leaves nothing public, which is the
# key safety property of the design. The human publish click in the GitHub UI
# is what fires stage 3. The dispatch inputs are the recovery path (draft
# deleted after the PR already merged).
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, e.g. 0.1.0"
        required: true
      target_ref:
        description: "Commit/ref the release points at (default: master)"
        required: false
        default: master
      previous_tag:
        description: "Override the previous tag for the notes range"
        required: false
      draft:
        description: "Create as draft"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve version and target
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.target_ref }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            REF="$INPUT_REF"
            DRAFT="$INPUT_DRAFT"
          else
            if [[ "$HEAD_REF" != release/v* ]]; then
              echo "expected a release/v branch"; exit 1
            fi
            VERSION="${HEAD_REF#release/v}"
            REF="$MERGE_SHA"
            DRAFT=true
          fi
          # Validate everything before emitting any single-line step outputs.
          for VALUE in "$VERSION" "$REF" "$DRAFT" "$INPUT_PREVIOUS_TAG"; do
            if [[ "$VALUE" == *$'\n'* || "$VALUE" == *$'\r'* ]]; then
              echo "release metadata must not contain line breaks"; exit 1
            fi
          done
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "expected a release version without leading v"; exit 1
          fi
          if [[ -z "$REF" || ( "$DRAFT" != true && "$DRAFT" != false ) ]]; then
            echo "expected a target ref and a true/false draft flag"; exit 1
          fi
          printf 'version=%s\nref=%s\ndraft=%s\n' "$VERSION" "$REF" "$DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/ci/.node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version carriers agree with the release version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/set-versions.mjs --check "$VERSION"

      # The private:true guard and the release flow cooperate rather than
      # collide: this fails BEFORE the human gate, naming the checklist item.
      - name: Publish guard removed?
        shell: bash
        run: |
          for pkg in packages/agent-plugin packages/sdk packages/cli; do
            if node -e "process.exit(require('./$pkg/package.json').private === true ? 1 : 0)"; then :; else
              echo "$pkg still carries \"private\": true. The release PR checklist's"
              echo "first-public-release items were not completed (docs/releases.md)."
              exit 1
            fi
          done

      # CI green on the target sha, bounded poll. The committed-artifact byte
      # gate and the docs drift gate live inside CI, so this one gate covers
      # both -- a version bump is exactly the change most likely to trip them.
      - name: CI green at the target sha
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          node scripts/wait-for-ci.mjs "$REPOSITORY" "$SHA"

      - name: Previous tag
        id: prev
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if [ -z "$PREVIOUS_TAG" ]; then
            # First release has no previous tag; empty is a handled input to
            # the notes script, not an error.
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          fi
          if [[ "$PREVIOUS_TAG" == *$'\n'* || "$PREVIOUS_TAG" == *$'\r'* ]]; then
            echo "previous tag must not contain line breaks"; exit 1
          fi
          printf 'tag=%s\n' "$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.prev.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pnpm build
          PREVIOUS_FLAGS=()
          if [ -n "$PREV" ]; then PREVIOUS_FLAGS+=(--previous-tag "$PREV"); fi
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)" \
            "${PREVIOUS_FLAGS[@]}" \
            --repo "$REPOSITORY" \
            --output release-notes.md

      - name: Create draft release
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          FLAGS=(--target "$(git rev-parse HEAD)" --notes-file release-notes.md --title "v$VERSION")
          [ "$DRAFT" = "true" ] && FLAGS+=(--draft)
          # Prerelease flag from the version suffix; a prerelease also gets the
          # npm `next` dist-tag in stage 3.
          if echo "$VERSION" | grep -qiE -- '-(rc|alpha|a|beta|b|dev|pre|preview)[.-]?[0-9]*$'; then
            FLAGS+=(--prerelease)
          fi
          gh release create "v$VERSION" "${FLAGS[@]}"

      - name: Delete the release branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD_REF" \
            || echo "branch already gone"
