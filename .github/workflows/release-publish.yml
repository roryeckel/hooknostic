name: Release publish

# Stage 3 of the release pipeline (docs/releases.md): fires when a human
# publishes the draft release that stage 2 created -- that click IS the ship
# decision. The dispatch input is the recovery path for a failed publish.
#
# First publication uses NPM_PUBLICATION_MODE=bootstrap in the protected npm
# environment: attach CI-built pnpm tarballs for the owner's interactive 2FA
# publication. After configuring trusted publishers, set the mode to oidc.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write # bootstrap attaches verified tarballs to the release
  id-token: write # npm trusted publishing (OIDC); no npm token secret

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v6

      # npm >= 11.5.1 is required for trusted publishing; Node 24 provides it.
      # Omit registry-url: npmjs.org is the default, and setup-node would write
      # an .npmrc token placeholder even though this workflow authenticates via OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/publishing/.node-version
          cache: pnpm

      - name: Validate publication mode
        id: publication
        # Resolve environment-scoped variables in a step, after the runner
        # has entered the protected environment, and freeze the chosen mode.
        env:
          NPM_PUBLICATION_MODE: ${{ vars.NPM_PUBLICATION_MODE || 'oidc' }}
        shell: bash
        run: |
          case "$NPM_PUBLICATION_MODE" in
            bootstrap|oidc) ;;
            *) echo "NPM_PUBLICATION_MODE must be bootstrap or oidc"; exit 1 ;;
          esac
          echo "mode=$NPM_PUBLICATION_MODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish guard still armed?
        shell: bash
        run: |
          for pkg in packages/agent-plugin packages/sdk packages/cli; do
            if node -e "process.exit(require('./$pkg/package.json').private === true ? 1 : 0)"; then :; else
              echo "$pkg still carries \"private\": true -- the release PR must remove it (docs/releases.md, first-release checklist)."
              exit 1
            fi
          done

      - name: Versions match the tag
        shell: bash
        run: node scripts/set-versions.mjs --check "${RELEASE_TAG#v}"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Attach first-publication tarballs and checksums
        if: steps.publication.outputs.mode == 'bootstrap'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bootstrap-release.mjs "${{ github.repository }}" "$RELEASE_TAG" "$RUNNER_TEMP/hooknostic-release-assets-${{ github.run_id }}-${{ github.run_attempt }}"

      # Libraries first, then the CLI.
      # pnpm publish (not npm publish): rewrites workspace:* specifiers to real
      # versions in the shipped manifest, and its OIDC flow honors npm trusted
      # publishing (id-token: write above) with no NPM_TOKEN secret involved.
      #
      # Each step is idempotent -- a version already on the registry is skipped
      # -- which is the single mechanic that makes the sdk-published/cli-failed
      # half-state recoverable by re-running this workflow. Never unpublish;
      # `npm deprecate` is the tool of record for a defective artifact.
      - name: Publish @hooknostic/sdk
        if: steps.publication.outputs.mode == 'oidc'
        working-directory: packages/sdk
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "@hooknostic/sdk@$VERSION" version --json >"$RUNNER_TEMP/npm-version.json" 2>"$RUNNER_TEMP/npm-error.log"; then
            echo "@hooknostic/sdk@$VERSION already on the registry; skipping"
          elif node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(result.error?.code === "E404" ? 0 : 1)' "$RUNNER_TEMP/npm-version.json"; then
            EXTRA=""
            [[ "$VERSION" == *-* ]] && EXTRA="--tag next" # prerelease never becomes latest
            pnpm publish --no-git-checks --access public $EXTRA
          else
            echo "Registry lookup failed; publication requires a confirmed E404."
            cat "$RUNNER_TEMP/npm-error.log"
            exit 1
          fi

      - name: Publish @hooknostic/agent-plugin
        if: steps.publication.outputs.mode == 'oidc'
        working-directory: packages/agent-plugin
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "@hooknostic/agent-plugin@$VERSION" version --json >"$RUNNER_TEMP/npm-version.json" 2>"$RUNNER_TEMP/npm-error.log"; then
            echo "@hooknostic/agent-plugin@$VERSION already on the registry; skipping"
          elif node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(result.error?.code === "E404" ? 0 : 1)' "$RUNNER_TEMP/npm-version.json"; then
            EXTRA=""
            [[ "$VERSION" == *-* ]] && EXTRA="--tag next"
            pnpm publish --no-git-checks --access public $EXTRA
          else
            echo "Registry lookup failed; publication requires a confirmed E404."
            cat "$RUNNER_TEMP/npm-error.log"
            exit 1
          fi

      - name: Publish hooknostic (CLI)
        if: steps.publication.outputs.mode == 'oidc'
        working-directory: packages/cli
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "hooknostic@$VERSION" version --json >"$RUNNER_TEMP/npm-version.json" 2>"$RUNNER_TEMP/npm-error.log"; then
            echo "hooknostic@$VERSION already on the registry; skipping"
          elif node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(result.error?.code === "E404" ? 0 : 1)' "$RUNNER_TEMP/npm-version.json"; then
            EXTRA=""
            [[ "$VERSION" == *-* ]] && EXTRA="--tag next"
            pnpm publish --no-git-checks --access public $EXTRA
          else
            echo "Registry lookup failed; publication requires a confirmed E404."
            cat "$RUNNER_TEMP/npm-error.log"
            exit 1
          fi
