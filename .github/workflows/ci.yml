name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate-ready:
    name: Renovate artifact readiness
    # A dependency update can require a PAT-authored artifact refresh. Do not
    # start seven runners on the intermediate commit: its successor will
    # trigger this workflow again. A no-op refresh proceeds immediately.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/ci/.node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require current generated artifacts
        shell: bash
        run: |
          pnpm build:examples
          changes="$(git status --porcelain -- examples/rewrite-shell examples/agent-plugin)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Generated artifacts need refreshing. The Renovate artifact writer will trigger CI on its successor commit."
            echo "If no successor appears, inspect Renovate artifacts and Apply Renovate artifacts; do not treat skipped matrix jobs as validation."
            exit 1
          fi

  dependency-policy:
    needs: renovate-ready
    if: ${{ !cancelled() && (needs.renovate-ready.result == 'success' || needs.renovate-ready.result == 'skipped') }}
    name: dependency policy and Renovate extraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The hosted app maintains its runtime. This image supplies the matching
    # validator CLI without adding Renovate's Node floor to workspace engines.
    container:
      image: ghcr.io/renovatebot/renovate:44.69.6
      options: --user 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: renovate-config-validator --strict renovate.json
      - name: Extract maintained dependencies without lookups or writes
        env:
          LOG_LEVEL: warn
          LOG_FILE_LEVEL: debug
          LOG_FILE: ${{ runner.temp }}/renovate-extraction.ndjson
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate
        run: renovate --platform=local --dry-run=extract --require-config=required --onboarding=false
      - name: Compare discovery with the authoritative inventory
        run: node scripts/check-dependencies.mjs "$RUNNER_TEMP/renovate-extraction.ndjson"

  test:
    needs: renovate-ready
    if: ${{ !cancelled() && (needs.renovate-ready.result == 'success' || needs.renovate-ready.result == 'skipped') }}
    name: lint + typecheck + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/ci/.node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Dependency ownership and engine consistency
        run: pnpm check:dependencies

      - name: Build (typecheck + bundle)
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          HOOKNOSTIC_PLAYBACK: ""
          HOOKNOSTIC_SMOKE: ""

      # The reproducibility gate. rewrite-shell commits its build output, so a
      # rebuild that changes bytes is either an undeclared input to the bundle or
      # a genuine source change someone forgot to rebuild -- both worth failing
      # on. This is the check that would have caught the esbuild absWorkingDir
      # defect (artifact bytes varying with the invocation directory) on the day
      # it landed, rather than in a downstream consumer months later.
      # Same discipline as the artifact gate below, for version facts: the
      # harness-support table is generated from adapter metadata, and every
      # adapter-adjacent range literal in docs must match that metadata.
      - name: Version metadata drives the docs
        shell: bash
        run: |
          node scripts/generate-harness-support.mjs
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --porcelain -- docs/
            git diff -- docs/
            echo "docs drifted from adapter metadata; run scripts/generate-harness-support.mjs"
            exit 1
          fi
          node scripts/check-version-literals.mjs

      - name: Committed example artifacts are reproducible
        # bash explicitly: the matrix includes windows-latest, where an
        # unshelled `run:` executes under PowerShell and the POSIX `if [ ... ]`
        # below is a parse error -- failing every Windows run before the
        # comparison, so the gate never actually ran on the platform most
        # likely to expose byte drift.
        shell: bash
        # `git status --porcelain`, not `git diff --exit-code`: diff reports
        # modifications and deletions of tracked files and is blind to a NEW
        # one. An adapter that starts emitting a fourth artifact would leave it
        # untracked, the gate would pass, and the committed set would be
        # silently incomplete -- which under ADR-0006 fails silently downstream.
        #
        # agent-plugin is rebuilt as well as rewrite-shell because it is the
        # only example using `agentPlugin`, whose build report is where an
        # absolute machine path can leak.
        run: |
          pnpm build:examples
          if [ -n "$(git status --porcelain -- examples/rewrite-shell examples/agent-plugin)" ]; then
            git status --porcelain -- examples/rewrite-shell examples/agent-plugin
            git diff -- examples/rewrite-shell examples/agent-plugin
            exit 1
          fi

  harness-playback:
    needs: renovate-ready
    if: ${{ !cancelled() && (needs.renovate-ready.result == 'success' || needs.renovate-ready.result == 'skipped') }}
    name: offline harness playback (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            package: "@anthropic-ai/claude-code"
          - harness: codex
            package: "@openai/codex"
          - harness: opencode
            package: "opencode-ai"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/playback/.node-version
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve captured harness version
        id: harness
        shell: bash
        run: |
          version="$(node --experimental-strip-types scripts/harness-playback-version.mjs '${{ matrix.harness }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install captured harness version
        run: npm install --global '${{ matrix.package }}@${{ steps.harness.outputs.version }}'

      - name: Bundle compiler and dependencies
        run: pnpm run bundle

      - name: Run model-free playback
        run: pnpm exec vitest run packages/cli/test/harness-playback.test.ts
        env:
          HOOKNOSTIC_PLAYBACK: ${{ matrix.harness }}
          # Deliberately blank: the test routes model traffic to loopback.
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
