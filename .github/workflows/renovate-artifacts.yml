name: Renovate artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: renovate-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: generate
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/ci/.node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:examples
      - name: Record generated files and originating commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/renovate-artifacts.mjs "$RUNNER_TEMP/manifest.json" "$PR_HEAD_SHA" "$PR_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: renovate-example-artifacts
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 2
