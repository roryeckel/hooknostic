# TEMPORARY: evidence for the Windows plan's review response (PR #288).
# Removed by a revert commit once the runs are recorded. Not a gate.
# Round 3: the Low-integrity lanes, with read denies and lane copies of pnpm
# and the npm prefix.
# The job id reuses the playback one so check-dependencies applies the
# playback Node version file to it.
name: Lane isolation trial (temporary)

on:
  push:
    branches: [ci/offline-playback]

permissions:
  contents: read

concurrency:
  group: lane-isolation-trial-${{ github.sha }}
  cancel-in-progress: false

jobs:
  harness-playback:
    name: windows ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: opencode-v2-low, kind: lane, harness: opencode-v2, cacheDirs: false }
          - { label: copilot-low, kind: lane, harness: copilot, cacheDirs: false }
          - { label: pi-low, kind: lane, harness: pi, cacheDirs: false }
          - { label: code-mode-low, kind: code-mode, harness: codex, cacheDirs: true }
    steps:
      # Default persist-credentials, as ci.yml's harness-playback has: the
      # checkout's credentials file is one of the read probes.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/playback/.node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle
      - name: Install the harness at the CI version
        id: harness
        shell: bash
        run: |
          if [ '${{ matrix.kind }}' = code-mode ]; then
            pkg=@openai/codex; version="$(node scripts/verify-code-mode.mjs --print-version)"
          else
            pkg="$(node --input-type=module -e 'import { harnessLanes } from "./scripts/harness-lanes.mjs"; console.log(harnessLanes[process.argv[1]].pkg)' '${{ matrix.harness }}')"
            version="$(node --experimental-strip-types scripts/harness-playback-version.mjs '${{ matrix.harness }}')"
          fi
          echo "pkg=$pkg version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm install --global "$pkg@$version"
      - name: Prepare offline prerequisites (admin, with network)
        shell: bash
        run: node --experimental-strip-types scripts/prepare-offline-playback.mjs '${{ matrix.harness }}' --version '${{ steps.harness.outputs.version }}' --check-online
        env:
          HKN_RIPGREP_DIR: ${{ runner.temp }}/hooknostic-ripgrep
      - name: Set up the lane user (prototype, Low integrity)
        shell: pwsh
        run: "& .capture/network-egress/windows/lane-setup.ps1 -Integrity Low"
      - name: Lane as the dedicated user
        if: ${{ matrix.kind == 'lane' }}
        shell: pwsh
        env:
          HOOKNOSTIC_PLAYBACK: ${{ matrix.harness }}
          HKN_PLAYBACK_ARTIFACT_DIR: ${{ runner.temp }}/opencode-v2-playback
          HKN_RIPGREP_DIR: ${{ runner.temp }}/hooknostic-ripgrep
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: |
          $files = 'packages/cli/test/harness-playback.test.ts packages/cli/test/opencode-v2-playback.test.ts scripts/pi-drift-driver.test.mjs'
          if ('${{ matrix.cacheDirs }}' -eq 'true') {
            & C:\hkn-admin\lane-run.ps1 -Label '${{ matrix.label }}' -DenyRead -CopyNpmPrefix -WorkspaceCacheDirs -RequireEnv 'HOOKNOSTIC_PLAYBACK,HKN_PLAYBACK_ARTIFACT_DIR,HKN_RIPGREP_DIR' -Command "node node_modules/vitest/vitest.mjs run $files"
          } else {
            & C:\hkn-admin\lane-run.ps1 -Label '${{ matrix.label }}' -DenyRead -CopyNpmPrefix -RequireEnv 'HOOKNOSTIC_PLAYBACK,HKN_PLAYBACK_ARTIFACT_DIR,HKN_RIPGREP_DIR' -Command "node node_modules/vitest/vitest.mjs run $files --configLoader runner --no-cache --fsModuleCachePath D:\hkn-lane\work\vitest-cache"
          }
          "wrapper exit code: $LASTEXITCODE"
          exit $LASTEXITCODE
      - name: Code Mode as the dedicated user
        if: ${{ matrix.kind == 'code-mode' }}
        shell: pwsh
        run: |
          & C:\hkn-admin\lane-run.ps1 -Label '${{ matrix.label }}' -DenyRead -CopyNpmPrefix -WorkspaceCacheDirs -Command 'node scripts/verify-code-mode.mjs'
          "wrapper exit code: $LASTEXITCODE"
          exit $LASTEXITCODE
      - name: After (always; staged admin copy)
        if: always()
        shell: pwsh
        run: |
          "job status so far: ${{ job.status }}"
          if (-not (Test-Path C:\hkn-admin\state.json)) { 'no setup state'; exit 1 }
          & C:\hkn-admin\lane-after.ps1 -Label '${{ matrix.label }}'
      - name: The runner still works after the lane (an upload as admin)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-trial-r3-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: C:/hkn-admin/*-after.json
