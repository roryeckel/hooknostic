# TEMPORARY: evidence for the plan's Linux lane-user section (PR #288).
# Removed by a revert commit once the runs are recorded. Not a gate. The job
# id reuses a playback one so check-dependencies applies the playback Node
# version file to it.
# Round 3 of the Linux trial: the trusted-state check runs in the lane step
# itself, and compares only the files it recorded. claude and opencode-v1,
# plus a plant attempt with and without the read-only remount.
name: Lane isolation trial (temporary)

on:
  push:
    branches: [ci/offline-playback]

permissions:
  contents: read

concurrency:
  group: lane-isolation-trial-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: ubuntu ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: claude, harness: claude, kind: lane }
          - { label: opencode-v1, harness: opencode-v1, kind: lane }
          - { label: plant-blocked, harness: pi, kind: plant }
          - { label: plant-mutant, harness: pi, kind: plant-mutant }
    steps:
      # Default persist-credentials, as ci.yml's harness-playback has: the
      # checkout's credentials file is one of the read probes.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.tool_cache }}/hkn-pnpm-setup
      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/node/playback/.node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the harness at the CI version
        id: harness
        if: ${{ matrix.kind == 'lane' }}
        shell: bash
        run: |
          version="$(node --experimental-strip-types scripts/harness-playback-version.mjs '${{ matrix.harness }}')"
          package="$(node --input-type=module -e 'import { harnessLanes } from "./scripts/harness-lanes.mjs"; console.log(harnessLanes[process.argv[1]].pkg)' '${{ matrix.harness }}')"
          echo "package=$package version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm install --global "$package@$version"
      - run: pnpm run bundle
        if: ${{ matrix.kind == 'lane' }}
      - name: Set up the lane user (prototype)
        shell: bash
        run: sudo -n bash .capture/network-egress/linux/lane-setup.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME" "$PATH" --grant-traverse
      - name: Prepare offline prerequisites (runner, with network)
        if: ${{ matrix.kind == 'lane' }}
        shell: bash
        run: node --experimental-strip-types scripts/prepare-offline-playback.mjs '${{ matrix.harness }}' --version '${{ steps.harness.outputs.version }}' --check-online
        env:
          HKN_RIPGREP_DIR: ${{ runner.temp }}/hooknostic-ripgrep
          npm_config_cache: /var/lib/hkn-lane/npm-cache
      - name: Lane as hknlane, in its namespaces
        if: ${{ matrix.kind == 'lane' }}
        shell: bash
        env:
          HOOKNOSTIC_PLAYBACK: ${{ matrix.harness }}
          HKN_PLAYBACK_ARTIFACT_DIR: ${{ runner.temp }}/opencode-v2-playback
          HKN_RIPGREP_DIR: ${{ runner.temp }}/hooknostic-ripgrep
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: >-
          bash .capture/network-egress/linux/lane-trial.sh --label '${{ matrix.label }}'
          --require HOOKNOSTIC_PLAYBACK,HKN_PLAYBACK_ARTIFACT_DIR,HKN_RIPGREP_DIR --node-modules-grant --
          node node_modules/vitest/vitest.mjs run packages/cli/test/harness-playback.test.ts packages/cli/test/opencode-v2-playback.test.ts scripts/pi-drift-driver.test.mjs
      - name: Plant a file beside node in the toolcache, as the lane
        if: ${{ matrix.kind != 'lane' }}
        continue-on-error: true
        shell: bash
        env:
          HOOKNOSTIC_PLAYBACK: ${{ matrix.harness }}
        run: >-
          bash .capture/network-egress/linux/lane-trial.sh --label '${{ matrix.label }}' --require HOOKNOSTIC_PLAYBACK
          ${{ matrix.kind == 'plant-mutant' && '--mutant-no-readonly' || '' }} --
          bash -c 'p="$(dirname "$(command -v node)")/hkn-planted"; if touch "$p" 2>/tmp/err; then echo "plant: CREATED"; else echo "plant: refused: $(cat /tmp/err)"; fi'
      - name: After (always; staged root copy)
        if: always()
        shell: bash
        run: sudo -n /bin/bash /var/lib/hkn-admin/lane-after.sh --label '${{ matrix.label }}'
